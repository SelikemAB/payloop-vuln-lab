name: lab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sodium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep pyyaml
      # main carries the pristine vulnerable baseline, so the full suite applies there.
      - name: Full verification (main)
        if: github.event_name == 'push'
        run: make all
      # A fix/* PR intentionally fixes ONE finding, so the full vulnerable-baseline suite
      # does not apply. Verify instead that this branch's finding is now mitigated.
      - name: Verify this finding's fix (pull request)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          F=$(printf '%s' "$HEAD_REF" | grep -oiE 'f[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          test -n "$F" || { echo "could not derive a finding id from branch '$HEAD_REF'"; exit 1; }
          echo "Branch '$HEAD_REF' fixes $F; asserting $F is mitigated on this branch."
          python3 tests/lab.py --app app --only "$F" --expect mitigated
