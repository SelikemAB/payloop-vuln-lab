name: lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sodium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep pyyaml
      - run: make all
