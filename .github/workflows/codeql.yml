name: codeql
# CodeQL analyses the Python tooling in this repo (test harness, rule tester, simulators).
# CodeQL does not support PHP, so the PHP app is covered by the custom semgrep taint rules, not here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
